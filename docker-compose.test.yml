# 仅供本机 Rust 数据库测试使用，与生产 Compose 的端口和数据目录隔离。
name: movie-harbor-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_harbor_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movie_harbor_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      # 测试数据库使用容器临时内存挂载，不写入生产默认的宿主数据库目录。
      - /var/lib/postgresql/data
