name: movie-harbor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${DATABASE_HOST_DIR:-./data/postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  media-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "chown 10001:10001 /media && chmod 0700 /media"]
    volumes:
      - type: bind
        source: ${MEDIA_HOST_DIR:-./data/media}
        target: /media
        bind:
          create_host_path: true

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    environment:
      LISTEN_ADDR: 0.0.0.0:3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MEDIA_DIR: /media
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY_HEADERS: "true"
      TRUST_PROXY_SECRET: ${TRUST_PROXY_SECRET:?set TRUST_PROXY_SECRET}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-53687091200}
      VIDEO_MIME_ALLOWLIST: ${VIDEO_MIME_ALLOWLIST:-video/mp4,video/webm}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    volumes:
      - type: bind
        source: ${MEDIA_HOST_DIR:-./data/media}
        target: /media
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  public-web:
    build:
      context: .
      dockerfile: frontend/public-web/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin-web:
    build:
      context: .
      dockerfile: frontend/admin-web/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/admin/"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      TRUST_PROXY_SECRET: ${TRUST_PROXY_SECRET:?set TRUST_PROXY_SECRET}
    depends_on:
      api:
        condition: service_healthy
      public-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${MEDIA_HOST_DIR:-./data/media}
        target: /srv/media
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
