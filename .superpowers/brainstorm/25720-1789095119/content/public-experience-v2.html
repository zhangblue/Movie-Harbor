<h2>访客端体验 · 首页修订版</h2>
<p class="subtitle">首页移除题材、年份和排序筛选；品牌区与内容入口分成上下两层。</p>

<div class="mockup">
  <div class="mockup-header">公开站 · 首页</div>
  <div class="mockup-body">
    <div class="mock-nav" style="padding:18px">
      <strong style="font-size:22px">Movie Harbor</strong>
    </div>
    <div style="display:grid;grid-template-columns:auto auto minmax(220px,420px);gap:10px;align-items:center;margin:18px 0">
      <button class="mock-button">电影</button>
      <button class="mock-button">剧集</button>
      <input class="mock-input" placeholder="搜索电影或剧集">
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
      <div class="placeholder" style="height:170px">海报<br>电影</div>
      <div class="placeholder" style="height:170px">海报<br>剧集</div>
      <div class="placeholder" style="height:170px">海报<br>电影</div>
      <div class="placeholder" style="height:170px">海报<br>剧集</div>
      <div class="placeholder" style="height:170px">海报<br>电影</div>
    </div>
  </div>
</div>

<div class="split" style="margin-top:22px">
  <div class="mockup">
    <div class="mockup-header">电影详情</div>
    <div class="mockup-body" style="display:grid;grid-template-columns:120px 1fr;gap:18px">
      <div class="placeholder" style="height:180px">海报</div>
      <div>
        <h3>电影标题</h3>
        <p>年份 · 时长 · 题材</p>
        <p>内容简介显示在这里。</p>
        <button class="mock-button">▶ 播放</button>
      </div>
    </div>
  </div>

  <div class="mockup">
    <div class="mockup-header">剧集详情</div>
    <div class="mockup-body">
      <h3>剧集标题</h3>
      <p>年份 · 题材</p>
      <div style="display:flex;gap:8px;margin:14px 0">
        <button class="mock-button">第 1 季</button>
        <button class="mock-button">第 2 季</button>
      </div>
      <div style="border-top:1px solid #ced5df;padding-top:12px">第 1 集 · 用户输入的集名称</div>
    </div>
  </div>
</div>

<div class="section" style="margin-top:22px">
  <h3>访客流程</h3>
  <p>首页混合展示已发布电影与剧集；“电影”“剧集”进入对应内容列表；搜索只匹配电影和剧集的标题与简介。播放进度仍仅保存在当前浏览器。</p>
</div>
